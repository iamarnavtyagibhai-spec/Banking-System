spring.application.name=ninjabank-user-service

# Server Port (Default: 8081 for standalone microservice)
server.port=${SERVER_PORT:8081}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://ep-twilight-mud-b5vwhdsv-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:neondb_owner}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:npg_mFlHLyC40bVz}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:default_jwt_secret_change_me_in_production_32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Brevo (Sendinblue) Email Service Configuration
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@ninjabank.com}
brevo.sender.name=${BREVO_SENDER_NAME:NinjaBank}
