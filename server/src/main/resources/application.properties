spring.application.name=BankingSystem

# PostgreSQL Database Configuration (Neon or Docker PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:YOUR_JWT_SECRET_KEY_MINIMUM_32_CHARACTERS_LONG}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Brevo (Sendinblue) Email Service Configuration
brevo.api.key=${BREVO_API_KEY:YOUR_BREVO_API_KEY}